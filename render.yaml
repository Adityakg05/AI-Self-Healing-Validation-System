services:
  # Streamlit UI Service
  - type: web
    name: ai-self-healing-validation-system-ui
    env: docker
    # dockerfilePath: ./Dockerfile (using default)
    plan: free
    autoDeploy: true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: LANGCHAIN_TRACING_V2
        value: false
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: BACKEND_URL
        value: https://your-backend-url.onrender.com
        sync: false
