services:
  # Streamlit UI Service
  - type: web
    name: ai-self-healing-validation-system-ui
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /_stcore/health
    startCommand: python -m streamlit run ui.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: BACKEND_URL
        value: https://ai-self-healing-validation-system.onrender.com
